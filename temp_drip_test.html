<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <title>Slow Stream Test (10s, 50bytes)</title>
    </head>

    <body>
        <h1>Slow Streaming Chat Experiment (10s, 50bytes)</h1>
        <div id="chat-box" style="white-space: pre-wrap; background: #f0f0f0; padding: 10px; border: 1px solid #ccc; min-height: 100px;"></div>
        <button id="stream-btn">受信開始</button>

        <script>
            const btn = document.getElementById('stream-btn');
            const box = document.getElementById('chat-box');

            async function startChat() {
                box.textContent = "🤖 通信待機中...\n";
                console.log("Start chat initiated");

                try {
                    // drip: 10秒かけて50個の「*」を送ってくる
                    const response = await fetch("https://httpbin.org/drip?duration=10&numbytes=50&code=200&delay=0");
                    console.log("Response received", response);

                    const decoder = new TextDecoder();

                    for await (const chunk of response.body) {
                        const text = decoder.decode(chunk);
                        box.textContent += text;
                    }

                    box.textContent += "\n🎉 受信完了！";
                } catch (e) {
                    console.error("Error during stream:", e);
                    box.textContent += "\n❌ エラーが発生しました: " + e.message;
                }
            }

            btn.addEventListener('click', startChat);
        </script>
    </body>

</html>
