<svg xmlns="http://www.w3.org/2000/svg" width="480" height="920" viewBox="0 0 480 920">
  <style>
    @media (prefers-color-scheme: dark) { .fg { fill: #f8f8f8; } }
    @media (prefers-color-scheme: light) { .fg { fill: #111; } }
  </style>
  <text
    x="40"
    y="56"
    font-family="'MS Gothic', 'Courier New', monospace"
    font-size="24"
    font-weight="400"
    class="fg"
  >
    <tspan x="40" dy="0">若き探求者よ。</tspan>
    <tspan x="40" dy="66"></tspan>
    <tspan x="40" dy="40">かつて、おぬしは嘆いたであろう。</tspan>
    <tspan x="60" dy="40">止まった時を──「凍結」と。</tspan>
    <tspan x="60" dy="40">見えぬ答えを──「恐怖」と。</tspan>
    <tspan x="40" dy="66"></tspan>
    <tspan x="40" dy="40">だが、今は違う。</tspan>
    <tspan x="40" dy="40">おぬしの瞳が、すべてを語っておる。</tspan>
    <tspan x="40" dy="66"></tspan>
    <tspan x="40" dy="40">「時の鍵」を掌握したのじゃ、おぬしは。</tspan>
    <tspan x="40" dy="66"></tspan>
    <tspan x="40" dy="40">知ったのであろう？</tspan>
    <tspan x="60" dy="40">待つことは、弱さにあらず。</tspan>
    <tspan x="60" dy="40">待つことは、繋がりの「祈り」。</tspan>
    <tspan x="40" dy="66"></tspan>
    <tspan x="40" dy="40">糸を紡げ、コードという名の。</tspan>
    <tspan x="40" dy="40">問いを放て、星の大海へ。</tspan>
    <tspan x="40" dy="66"></tspan>
    <tspan x="40" dy="40">その静寂を、恐れるでない。</tspan>
    <tspan x="60" dy="40">独りではない、おぬしは。</tspan>
    <tspan x="60" dy="40">決して。</tspan>
    <tspan x="40" dy="66"></tspan>
    <tspan x="40" dy="40">時空の果てより、</tspan>
    <tspan x="60" dy="40">星々の彼方より、</tspan>
    <tspan x="80" dy="40">必ずや巡り来る──「答え」は。</tspan>
  </text>
</svg>
