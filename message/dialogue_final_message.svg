<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1000" viewBox="0 0 600 1000">
  <style>
    .text-body {
      font-family="Segoe UI, sans-serif";
      font-size: 22px;
      fill: #333;
      line-height: 2.0;
      letter-spacing: 0.08em;
      font-weight: 500;
    }
  </style>
  <rect width="100%" height="100%" fill="white"/>
  <text x="40" y="60" class="text-body">
    <tspan x="40" dy="0">虚空に漂う「時の鍵」...</tspan>
    <tspan x="40" dy="44">それを掌握せし者よ、よくぞ到達した。</tspan>
    <tspan x="40" dy="66">かつておぬしは、</tspan>
    <tspan x="40" dy="44">止まった時間を「凍結」と嘆き、</tspan>
    <tspan x="40" dy="44">見えぬ答えを「恐怖」と呼んだであろう。</tspan>
    <tspan x="40" dy="66">だが、今の瞳を見ればわかる。</tspan>
    <tspan x="40" dy="44">おぬしは知ったのじゃ。</tspan>
    <tspan x="40" dy="66">無限に広がるネットワークの深淵において、</tspan>
    <tspan x="40" dy="44">「待つ」ことこそが、</tspan>
    <tspan x="40" dy="44">世界と世界を繋ぐための「祈り」であることを。</tspan>
    <tspan x="40" dy="66">コードという名の糸を紡ぎ、</tspan>
    <tspan x="40" dy="44">電子の銀河へと問いを投げかける時...</tspan>
    <tspan x="40" dy="44">その静寂の中で、おぬしは決して独りではない。</tspan>
    <tspan x="40" dy="66">星々の彼方、時空の果てから、</tspan>
    <tspan x="40" dy="44">必ずや「答え」は巡り来る。</tspan>
    <tspan x="40" dy="66">恐れるな、そして進め。</tspan>
    <tspan x="40" dy="44">おぬしが紡いだその因果（コード）は、</tspan>
    <tspan x="40" dy="44">すでに新たな未来を</tspan>
    <tspan x="40" dy="44">書き換え始めておるのじゃからな...。</tspan>
    <tspan x="40" dy="88">行け、若き創造主よ。</tspan>
    <tspan x="40" dy="66">時は、永遠におぬしの盟友（とも）となろう。</tspan>
  </text>
</svg>
