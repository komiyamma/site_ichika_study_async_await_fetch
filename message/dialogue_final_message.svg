<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <style>
    .text-body {
      font-family="Segoe UI, sans-serif";
      font-size: 22px;
      fill: #333;
      line-height: 2.0;
      letter-spacing: 0.08em;
      font-weight: 500;
    }
  </style>
  <rect width="100%" height="100%" fill="white"/>
  <text x="40" y="60" class="text-body">
    <tspan x="40" dy="0">若き探求者よ、</tspan>
    <tspan x="40" dy="44">よくぞ伝説の「時の鍵」を掌握した。</tspan>
    <tspan x="40" dy="66">かつておぬしは、</tspan>
    <tspan x="40" dy="44">止まった時間を「凍結」と嘆き、</tspan>
    <tspan x="40" dy="44">見えぬ答えを「恐怖」と呼んだであろう。</tspan>
    <tspan x="40" dy="66">だが、今の瞳を見ればわかる。</tspan>
    <tspan x="40" dy="44">おぬしは知ったのじゃ。</tspan>
    <tspan x="40" dy="66">無限に広がるネットワークの深淵において、</tspan>
    <tspan x="40" dy="44">「待つ」ことこそが、</tspan>
    <tspan x="40" dy="44">世界と世界を繋ぐための「祈り」であることを。</tspan>
    <tspan x="40" dy="66">コードという名の糸を紡ぎ、</tspan>
    <tspan x="40" dy="44">星の大海へと問いを投げかける時...</tspan>
    <tspan x="40" dy="44">その静寂の中で、おぬしは決して独りではない。</tspan>
    <tspan x="40" dy="66">星々の彼方、時空の果てから、</tspan>
    <tspan x="40" dy="44">必ずや「答え」は巡り来る。</tspan>
  </text>
</svg>
