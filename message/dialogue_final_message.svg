<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1400" viewBox="0 0 600 1400" role="img" aria-labelledby="title">
  <title>謎の言霊</title>
  <style>
    @media (prefers-color-scheme: dark) { .fg { fill: #f8f8f8; } }
    @media (prefers-color-scheme: light) { .fg { fill: #111; } }
  </style>
  <text
    x="64"
    y="56"
    font-family="Segoe UI, sans-serif"
    font-size="28"
    font-weight="400"
    class="fg"
  >
    <tspan x="40" dy="0">よくぞ「時の鍵」を手に入れたな、</tspan>
    <tspan x="40" dy="40">若き時空の旅人よ。</tspan>
    <tspan x="40" dy="60">おぬしは学んだはずじゃ。</tspan>
    <tspan x="40" dy="40">「待つ」ことの強さを。</tspan>
    <tspan x="40" dy="60">かつて、おぬしにとって「待ち時間」は、</tspan>
    <tspan x="40" dy="40">ただの空白、恐れるべき停止じゃった。</tspan>
    <tspan x="40" dy="40">だが今、おぬしはその空白を「信頼」に変え、</tspan>
    <tspan x="40" dy="40">未来からの便りを受け取る術を得た。</tspan>
    <tspan x="40" dy="60">相手が答えるまで待ち、</tspan>
    <tspan x="40" dy="40">時には仲間と手を取り合い、</tspan>
    <tspan x="40" dy="40">決して焦らず、流れを操る。</tspan>
    <tspan x="40" dy="40">その調和こそが、</tspan>
    <tspan x="40" dy="40">この広大な世界と対話するための、</tspan>
    <tspan x="40" dy="40">真の作法なのじゃ。</tspan>
    <tspan x="40" dy="60">恐れることはない。</tspan>
    <tspan x="40" dy="40">おぬしの書くコードはもう、独り言ではない。</tspan>
    <tspan x="40" dy="40">星の向こうの誰かと繋がり、</tspan>
    <tspan x="40" dy="40">想いを届け、受け取ることができる。</tspan>
    <tspan x="40" dy="60">さあ、行くが良い。</tspan>
    <tspan x="40" dy="40">その鍵は、まだ見ぬ扉を開くためにある。</tspan>
    <tspan x="40" dy="40">時は、常におぬしの味方じゃよ。</tspan>
  </text>
</svg>
