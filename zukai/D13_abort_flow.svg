<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; }
      .label { font-size: 14px; font-family: sans-serif; text-anchor: middle; }
      .title { font-size: 18px; font-weight: bold; font-family: sans-serif; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .remote { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; rx: 10; }
      .signal { fill: #b91c1c; font-weight: bold; }
      .truck { fill: #eff6ff; stroke: #2563eb; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="300" y="30" class="title">キャンセルの仕組み (Abort Signal)</text>

  <!-- Remote -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="100" height="150" class="remote" />
    <text x="50" y="40" class="label" fill="#b91c1c">リモコン</text>
    <text x="50" y="60" class="label" font-size="10">(Controller)</text>
    
    <!-- Button -->
    <circle cx="50" cy="100" r="20" fill="#ef4444" stroke="#7f1d1d" />
    <text x="50" y="105" class="label" fill="#fff" font-size="10">STOP</text>
  </g>

  <!-- Signal Path -->
  <path d="M 100 100 L 220 100" class="arrow" stroke="#dc2626" stroke-width="3" />
  <text x="160" y="80" class="signal">Abort!</text>
  <text x="160" y="95" class="label" font-size="10">(Signal)</text>

  <!-- Truck (fetch) -->
  <g transform="translate(230, 80)">
    <path d="M 0 20 L 140 20 L 160 50 L 160 100 L 0 100 Z" class="truck" stroke-width="2" />
    <circle cx="40" cy="100" r="15" fill="#333" />
    <circle cx="120" cy="100" r="15" fill="#333" />
    <text x="80" y="70" class="label">fetch</text>
  </g>

  <!-- Stop Action -->
  <g transform="translate(420, 80)">
    <text x="80" y="30" class="label" font-weight="bold" fill="#ef4444">急ブレーキ!🛑</text>
    <path d="M 10 70 L 150 70" class="arrow" />
    
    <g transform="translate(40, 90)">
      <rect x="0" y="0" width="80" height="50" class="box" fill="#fef2f2" stroke="#ef4444" />
       <text x="40" y="25" class="label" fill="#b91c1c">catch</text>
       <text x="40" y="40" class="label" font-size="10">AbortError</text>
    </g>
  </g>

  <!-- Connection -->
  <path d="M 390 100 L 450 100" class="arrow" stroke-dasharray="5,5" />

</svg>
