<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 8; ry: 8; }
      .ticket { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .coffee { fill: #78350f; stroke: #fff; }
      .error { fill: #ef4444; stroke: #fff; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .label { font-family: sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-family: sans-serif; font-size: 20px; font-weight: bold; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="300" y="40" class="title">Promise（予約チケット）の仕組み</text>

  <!-- Step 1: Order -->
  <g transform="translate(50, 100)">
    <circle cx="40" cy="40" r="30" fill="#dbeafe" />
    <text x="40" y="45" class="label">あなた</text>
    <text x="100" y="25" font-family="sans-serif" font-size="12">注文する</text>
    <line x1="80" y1="40" x2="160" y2="40" class="arrow" />
  </g>

  <!-- Step 2: Receive Ticket -->
  <g transform="translate(200, 75)">
    <rect x="0" y="0" width="120" height="90" class="ticket" />
    <text x="60" y="25" class="label" font-weight="bold" fill="#b45309">Promise</text>
    <text x="60" y="50" class="label" font-size="12">予約チケット</text>
    <text x="60" y="75" class="label" font-size="10">(Pending: 準備中)</text>
  </g>

  <!-- Arrow split -->
  <path d="M 320 120 L 400 120" class="arrow" />
  <text x="360" y="110" class="label" font-size="12">待機...</text>

  <!-- Targeted to new box centers: Success y=65, Failure y=195 -->
  <path d="M 400 120 Q 450 120 480 65" class="arrow" stroke="#16a34a" />
  <path d="M 400 120 Q 450 120 480 195" class="arrow" stroke="#ef4444" />

  <!-- Outcome 1: Success -->
  <!-- Center y = 20 + 45 = 65 -->
  <g transform="translate(500, 20)">
    <rect x="0" y="0" width="140" height="90" class="box" style="stroke: #16a34a; fill: #f0fdf4;" />
    <text x="70" y="25" class="label" fill="#15803d" font-weight="bold">Fulfilled (成功)</text>
    <circle cx="30" cy="60" r="15" fill="#78350f" /> 
    <text x="80" y="65" font-family="sans-serif" font-size="12">コーヒー完成!</text>
  </g>

  <!-- Outcome 2: Failure -->
  <!-- Center y = 150 + 45 = 195 -->
  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="140" height="90" class="box" style="stroke: #b91c1c; fill: #fef2f2;" />
    <text x="70" y="25" class="label" fill="#b91c1c" font-weight="bold">Rejected (失敗)</text>
    <text x="70" y="60" font-family="sans-serif" font-size="12">材料切れ...</text>
  </g>

  <!-- Resolution -->
  <g transform="translate(720, 110)">
    <text x="0" y="15" font-family="sans-serif" font-size="12">後で結果を受け取る</text>
    <text x="0" y="40" font-family="sans-serif" font-size="12" font-weight="bold">.then() / .catch()</text>
  </g>
  
  <!-- Resolution Arrows -->
  <path d="M 640 65 L 710 115" class="arrow" stroke="#16a34a" />
  <path d="M 640 195 L 710 140" class="arrow" stroke="#ef4444" />

</svg>
