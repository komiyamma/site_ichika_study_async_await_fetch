<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 550">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; font-family: sans-serif; text-anchor: middle; }
      .label { font-size: 14px; font-family: sans-serif; text-anchor: middle; fill: #333; }
      .thread-label { font-size: 16px; font-family: sans-serif; text-anchor: middle; font-weight: bold; }
      .note { font-size: 12px; font-family: sans-serif; fill: #64748b; }
      
      .timeline { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
      
      .arrow-line { stroke: #333; stroke-width: 2; fill: none; }
      .arrow-head { fill: #333; }
      
      .box-main { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
      .box-a { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; }
      .box-b { fill: #e0f2fe; stroke: #3b82f6; stroke-width: 2; }
    </style>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="325" y="40" class="title">マルチスレッド（C++/C#など）の働き方</text>

  <!-- ========================
       Timelines
       ======================== -->
  
  <!-- Main Thread (Left) -->
  <g transform="translate(100, 0)">
    <text x="0" y="80" class="thread-label" fill="#333">司令塔 (Main)</text>
    <line x1="0" y1="100" x2="0" y2="500" class="timeline" />
  </g>

  <!-- Thread A (Center) -->
  <g transform="translate(325, 0)">
    <text x="0" y="80" class="thread-label" fill="#b91c1c">バイトA (スレッド1)</text>
    <line x1="0" y1="100" x2="0" y2="420" class="timeline" stroke="#fca5a5" />
  </g>

  <!-- Thread B (Right) -->
  <g transform="translate(550, 0)">
    <text x="0" y="80" class="thread-label" fill="#0369a1">バイトB (スレッド2)</text>
    <line x1="0" y1="100" x2="0" y2="420" class="timeline" stroke="#bae6fd" />
  </g>

  <!-- ========================
       Phase 1: Instruction
       ======================== -->
  
  <!-- Arrow to A -->
  <path d="M 100 120 L 315 140" class="arrow-line" marker-end="url(#arrowhead)" />
  <text x="210" y="125" class="label" transform="rotate(5, 210, 125)">指示出し</text>

  <!-- Arrow to B -->
  <path d="M 100 120 L 540 140" class="arrow-line" marker-end="url(#arrowhead)" />
  <text x="400" y="125" class="label" transform="rotate(3, 400, 125)">指示出し</text>


  <!-- ========================
       Phase 2: Parallel Work
       ======================== -->
  
  <!-- Annotation for Parallel -->
  <rect x="50" y="160" width="550" height="150" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="8,4" />
  <text x="580" y="155" class="note" text-anchor="end">並列処理 (Parallel)</text>

  <!-- Main Work -->
  <rect x="70" y="170" width="60" height="120" rx="4" class="box-main" />
  <text x="100" y="230" class="label" style="font-size:12px;">レジ打ち<br/>(自分の仕事)</text>

  <!-- Thread A Work -->
  <rect x="295" y="170" width="60" height="120" rx="4" class="box-a" />
  <text x="325" y="230" class="label" fill="#b91c1c">スープ作り</text>

  <!-- Thread B Work -->
  <rect x="520" y="170" width="60" height="120" rx="4" class="box-b" />
  <text x="550" y="230" class="label" fill="#0369a1">野菜切り</text>


  <!-- ========================
       Phase 3: Completion & Join
       ======================== -->

  <!-- A Reports Back -->
  <path d="M 325 310 L 110 360" class="arrow-line" marker-end="url(#arrowhead)" />
  <text x="250" y="330" class="label" fill="#b91c1c">完了報告</text>

  <!-- B Reports Back -->
  <path d="M 550 310 L 110 400" class="arrow-line" marker-end="url(#arrowhead)" />
  <text x="450" y="350" class="label" fill="#0369a1">完了報告</text>

  <!-- Main Merge -->
  <rect x="70" y="380" width="60" height="80" rx="4" class="box-main" fill="#f1f5f9" />
  <text x="100" y="420" class="label">合流・集計</text>

</svg>
