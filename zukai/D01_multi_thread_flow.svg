<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; font-family: sans-serif; text-anchor: middle; }
      .label { font-size: 14px; font-family: sans-serif; text-anchor: middle; }
      .box { fill: #f1f5f9; stroke: #334155; stroke-width: 2; rx: 5; }
      .timeline { stroke: #333; stroke-width: 4; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="400" y="40" class="title">マルチスレッド（C++/C#など）の働き方</text>

  <!-- Main Thread -->
  <g transform="translate(100, 80)">
    <text x="100" y="30" class="label" font-weight="bold">司令塔 (Main)</text>
    <line x1="100" y1="50" x2="100" y2="300" class="timeline" stroke="#333" />
    <rect x="80" y="150" width="40" height="100" fill="#cbd5e1" />
    <text x="50" y="200" class="label">自分の仕事</text>
  </g>

  <!-- Thread A -->
  <g transform="translate(300, 80)">
    <text x="100" y="30" class="label" font-weight="bold" fill="#b91c1c">バイトA</text>
    <line x1="100" y1="50" x2="100" y2="250" class="timeline" stroke="#ef4444" />
    <rect x="80" y="100" width="40" height="100" fill="#fca5a5" />
    <text x="210" y="180" class="label" fill="#b91c1c">スープ作り</text>
  </g>

  <!-- Thread B -->
  <g transform="translate(500, 80)">
    <text x="100" y="30" class="label" font-weight="bold" fill="#0369a1">バイトB</text>
    <line x1="100" y1="50" x2="100" y2="250" class="timeline" stroke="#2563eb" />
    <rect x="80" y="100" width="40" height="100" fill="#bae6fd" />
    <text x="210" y="180" class="label" fill="#0369a1">野菜切り</text>
  </g>

  <!-- Fork Arrows -->
  <path d="M 200 100 L 400 100" class="arrow" />
  <text x="300" y="90" class="label" font-size="12">指示出し</text>
  <path d="M 200 100 L 600 100" class="arrow" />

  <!-- Join Arrows -->
  <path d="M 400 250 L 200 280" class="arrow" />
  <path d="M 600 250 L 200 280" class="arrow" />
  <text x="300" y="300" class="label" font-size="12">完了報告</text>

  <!-- Parallel label -->
  <rect x="350" y="140" width="300" height="40" fill="none" stroke="#64748b" stroke-dasharray="5,5" />
  <text x="500" y="165" class="label" fill="#64748b">全員同時に動いている！（パラレル）</text>

</svg>
