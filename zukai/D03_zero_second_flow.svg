<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; }
      .process { fill: #fef2f2; stroke: #b91c1c; stroke-width: 2; }
      .webapi { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .queue { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .title { font-size: 20px; font-weight: bold; font-family: sans-serif; text-anchor: middle; }
      .label { font-size: 14px; font-family: sans-serif; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .gate { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="400" y="40" class="title">0秒タイマーのからくり（イベントループ）</text>

  <!-- Lane 1: Main Thread -->
  <text x="150" y="70" class="label" font-weight="bold">①メインスレッド(Stack)</text>
  <rect x="50" y="80" width="200" height="350" fill="#f9fafb" stroke="#e5e7eb" />
  
  <rect x="80" y="100" width="140" height="40" class="process" />
  <text x="150" y="125" class="label">A. スタート</text>

  <rect x="80" y="160" width="140" height="40" class="process" />
  <text x="150" y="185" class="label">setTimeout(0秒)</text>

  <rect x="80" y="220" width="140" height="40" class="process" />
  <text x="150" y="245" class="label">C. ゴール</text>

  <text x="150" y="290" class="label" fill="#666" font-size="12">↓ 空っぽになるまで続く</text>

  <!-- Lane 2: Web API -->
  <text x="400" y="70" class="label" font-weight="bold">②Web API(裏方)</text>
  <rect x="300" y="80" width="200" height="150" fill="#f9fafb" stroke="#e5e7eb" />

  <rect x="330" y="160" width="140" height="40" class="webapi" />
  <text x="400" y="185" class="label" fill="#1e3a8a">0秒計測...</text>
  
  <!-- Lane 3: Queue -->
  <text x="650" y="70" class="label" font-weight="bold">③行列(Queue)</text>
  <rect x="550" y="200" width="200" height="230" fill="#f9fafb" stroke="#e5e7eb" />
  
  <rect x="580" y="240" width="140" height="40" class="queue" />
  <text x="650" y="265" class="label" fill="#14532d">B. 0秒経ったよ</text>
  <text x="650" y="295" class="label" font-size="10">出番待ち...</text>

  <!-- Event Loop Gate -->
  <circle cx="400" cy="350" r="40" class="gate" />
  <text x="400" y="355" class="label" font-weight="bold" font-size="12">イベント<br/>ループ</text>
  <text x="400" y="410" class="label" fill="#d97706" font-size="12">メインが空いたら<br/>通す！</text>

  <!-- Arrows -->
  <path d="M 220 180 L 330 180" class="arrow" />
  <text x="275" y="170" class="label" font-size="10">依頼</text>

  <path d="M 470 180 L 650 180 L 650 240" class="arrow" />
  <text x="560" y="170" class="label" font-size="10">終わったら並ぶ</text>

  <path d="M 580 260 L 440 330" class="arrow" />
  
  <path d="M 360 330 L 150 330" class="arrow" stroke-dasharray="5,5" />
  <text x="300" y="320" class="label" font-size="10" fill="#d97706">許可</text>
  
  <!-- Final Step -->
  <rect x="80" y="360" width="140" height="40" class="process" style="fill:#dcfce7; stroke:#16a34a;" />
  <text x="150" y="385" class="label">B. 0秒経ったよ</text>
  <text x="150" y="415" class="label" font-size="10" fill="#16a34a">(ようやく実行)</text>

</svg>
