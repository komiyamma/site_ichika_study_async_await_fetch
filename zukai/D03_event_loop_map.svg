<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 8; ry: 8; }
      .area-label { font-size: 18px; font-weight: bold; fill: #333; font-family: sans-serif; }
      .item { fill: #dbeafe; stroke: #2563eb; stroke-width: 1; rx: 4; }
      .item-text { font-size: 14px; fill: #1e3a8a; text-anchor: middle; font-family: sans-serif; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" font-family="sans-serif">JSキッチンの見取り図（イベントループ）</text>

  <!-- Call Stack (Kitchen) -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="200" height="300" class="box" fill="#f8fafc" />
    <text x="100" y="30" text-anchor="middle" class="area-label">①コールスタック</text>
    <text x="100" y="50" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">(まな板・調理場)</text>
    
    <!-- Stack Item -->
    <rect x="30" y="220" width="140" height="40" class="item" fill="#fee2e2" stroke="#dc2626" />
    <text x="100" y="245" class="item-text" fill="#7f1d1d">今の作業(Main)</text>
    
    <text x="100" y="150" font-size="12" text-anchor="middle" fill="#999" font-family="sans-serif">一つしか置けない！</text>
  </g>

  <!-- Web API (Oven) -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="180" height="150" class="box" fill="#e0e7ff" stroke="#4338ca" />
    <text x="90" y="30" text-anchor="middle" class="area-label">②Web API</text>
    <text x="90" y="50" text-anchor="middle" font-size="12" fill="#4338ca" font-family="sans-serif">(オーブン・待機所)</text>

    <rect x="30" y="80" width="120" height="40" class="item" fill="#ffffff" stroke="#4338ca" />
    <text x="90" y="105" class="item-text" fill="#4338ca">timer(3秒)</text>
    
    <text x="90" y="140" font-size="10" text-anchor="middle" fill="#4338ca" font-family="sans-serif">ブラウザが管理</text>
  </g>

  <!-- Callback Queue (Line) -->
  <g transform="translate(300, 300)">
    <rect x="0" y="0" width="450" height="100" class="box" fill="#f0fdf4" stroke="#16a34a" />
    <text x="225" y="30" text-anchor="middle" class="area-label">③タスクキュー（行列）</text>

    <!-- Queue Items -->
    <rect x="30" y="50" width="100" height="30" class="item" fill="#fff" stroke="#16a34a" />
    <text x="80" y="70" class="item-text" fill="#15803d">コールバックA</text>

    <rect x="140" y="50" width="100" height="30" class="item" fill="#fff" stroke="#16a34a" />
    <text x="190" y="70" class="item-text" fill="#15803d">コールバックB</text>
    
    <rect x="250" y="50" width="100" height="30" class="item" fill="#fff" stroke="#16a34a" />
    <text x="300" y="70" class="item-text" fill="#15803d">クリック処理</text>
  </g>

  <!-- Event Loop (Gatekeeper) -->
  <g transform="translate(260, 220)">
     <circle cx="0" cy="0" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="3" />
     <text x="0" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706" font-family="sans-serif">イベント<br/>ループ</text>
  </g>
  
  <!-- Arrows -->
  <!-- Stack to API -->
  <path d="M 230 140 L 300 140" class="arrow" stroke-dasharray="4" />
  <text x="265" y="130" font-size="10" text-anchor="middle" font-family="sans-serif">依頼</text>
  
  <!-- API to Queue -->
  <path d="M 400 250 L 400 300" class="arrow" />
  <text x="440" y="275" font-size="10" text-anchor="middle" font-family="sans-serif">完了したら並ぶ</text>

  <!-- Queue to Loop -->
  <path d="M 300 350 L 260 250" class="arrow" fill="none" />
  
  <!-- Loop to Stack -->
  <path d="M 240 230 L 150 300" class="arrow" stroke-width="4" stroke="#d97706" />
  <text x="180" y="270" font-size="12" font-weight="bold" fill="#d97706" font-family="sans-serif">空いたら入れる！</text>

</svg>
