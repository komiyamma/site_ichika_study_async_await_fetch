<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .line { stroke: #333; stroke-width: 4; }
      .pause-bar { stroke: #db2777; stroke-width: 6; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; }
      .desc { font-family: sans-serif; font-size: 14px; fill: #666; }
      .box { fill: #fff; stroke: #333; stroke-width: 2; }
    </style>
  </defs>

  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">async/await のイメージ（一時停止）</text>

  <!-- Timeline -->
  <line x1="100" y1="100" x2="100" y2="350" class="line" stroke="#e2e8f0" stroke-width="10" />
  
  <!-- Step 1 -->
  <circle cx="100" cy="100" r="10" fill="#3b82f6" />
  <text x="130" y="105" class="label" fill="#1e3a8a">処理スタート</text>
  
  <line x1="100" y1="100" x2="100" y2="160" class="line" stroke="#3b82f6" />

  <!-- Await Point -->
  <g transform="translate(80, 160)">
    <rect x="-20" y="0" width="40" height="8" fill="#db2777" />
    <rect x="-20" y="12" width="40" height="8" fill="#db2777" />
    <text x="50" y="15" class="label" fill="#db2777" font-size="18">await (一時停止)</text>
    <text x="50" y="40" class="desc">Promiseの結果が出るまで待機...</text>
  </g>

  <!-- Waiting Gap -->
  <line x1="100" y1="180" x2="100" y2="260" class="line" stroke="#cbd5e1" stroke-dasharray="8,8" />
  <text x="130" y="225" class="desc" fill="#94a3b8">（ブラウザはフリーズせず、他の裏処理が可能）</text>

  <!-- Resume -->
  <g transform="translate(80, 260)">
    <polygon points="-10,0 20,10 -10,20" fill="#10b981" />
    <text x="50" y="15" class="label" fill="#10b981">再開 (Resolve)</text>
  </g>

  <line x1="100" y1="280" x2="100" y2="350" class="line" stroke="#10b981" />

  <!-- Step 3 -->
  <circle cx="100" cy="350" r="10" fill="#10b981" />
  <text x="130" y="355" class="label" fill="#047857">次の処理へ</text>

  <!-- Comparison -->
  <g transform="translate(500, 150)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
    <text x="125" y="30" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#475569">見た目のメリット</text>
    <text x="20" y="60" font-family="sans-serif" font-size="14">まるで「同期処理」のように</text>
    <text x="20" y="80" font-family="sans-serif" font-size="14">上から下へまっすぐ読める！</text>
    <text x="20" y="100" font-family="sans-serif" font-size="14" fill="#db2777">（ネストもしない、チェーンも不要）</text>
  </g>

</svg>
