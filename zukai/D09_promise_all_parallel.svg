<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .bar { stroke-width: 0; rx: 5; ry: 5; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #333; text-anchor: middle; }
      .time-label { font-family: sans-serif; font-size: 14px; fill: #666; }
      .arrow-time { stroke: #999; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999" />
    </marker>
  </defs>

  <text x="400" y="40" class="label" font-size="24">直列(Serial) vs 並列(Parallel)</text>
  
  <!-- Case 1: Serial -->
  <g transform="translate(50, 80)">
    <text x="150" y="-10" class="label">これまで（直列）</text>
    <text x="320" y="90" class="label" fill="#ef4444" font-size="20">遅い！(5秒)</text>

    <!-- Task A -->
    <rect x="0" y="20" width="180" height="40" class="bar" fill="#60a5fa" />
    <text x="90" y="45" class="label" fill="#fff">Task A (3秒)</text>

    <!-- Task B (starts after A) -->
    <rect x="180" y="60" width="120" height="40" class="bar" fill="#facc15" />
    <text x="240" y="85" class="label" fill="#fff">Task B (2秒)</text>

    <!-- Total Time Line -->
    <line x1="0" y1="120" x2="300" y2="120" stroke="#333" stroke-width="2" />
    <text x="0" y="140" class="time-label">0s</text>
    <text x="180" y="140" class="time-label">3s</text>
    <text x="300" y="140" class="time-label">5s</text>
  </g>

  <!-- Case 2: Parallel -->
  <g transform="translate(450, 80)">
    <text x="150" y="-10" class="label">Promise.all（並列）</text>
    <text x="320" y="90" class="label" fill="#16a34a" font-size="20">速い！(3秒)</text>

    <!-- Task A -->
    <rect x="0" y="20" width="180" height="40" class="bar" fill="#60a5fa" />
    <text x="90" y="45" class="label" fill="#fff">Task A (3秒)</text>

    <!-- Task B (starts at 0) -->
    <rect x="0" y="70" width="120" height="40" class="bar" fill="#facc15" />
    <text x="60" y="95" class="label" fill="#fff">Task B (2秒)</text>
    
    <!-- Wait Line -->
    <line x1="180" y1="20" x2="180" y2="120" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5" />
    <text x="180" y="15" class="time-label" fill="#ef4444" text-anchor="middle">待機ライン</text>

    <!-- Total Time Line -->
    <line x1="0" y1="130" x2="180" y2="130" stroke="#333" stroke-width="2" />
    <text x="0" y="150" class="time-label">0s</text>
    <text x="180" y="150" class="time-label">3s</text>
  </g>
  
  <!-- Explanation -->
  <g transform="translate(200, 280)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#f0f9ff" stroke="#0ea5e9" />
    <text x="200" y="30" class="label" fill="#0369a1">Point</text>
    <text x="200" y="55" class="time-label" text-anchor="middle" font-size="16">「一番遅い作業」が終わった時点で完了！</text>
  </g>

</svg>
