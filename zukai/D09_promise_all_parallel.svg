<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650">
  <defs>
    <style>
      .bar { stroke-width: 0; rx: 5; ry: 5; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #333; text-anchor: middle; }
      .title-text { font-family: sans-serif; font-size: 20px; font-weight: bold; fill: #111; text-anchor: middle; }
      .time-label { font-family: sans-serif; font-size: 14px; fill: #666; }
      .arrow-time { stroke: #999; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  
  <text x="300" y="40" class="title-text">直列(Serial) vs 並列(Parallel)</text>
  
  <!-- ===============================
       1. Serial (Top)
       =============================== -->
  <g transform="translate(100, 70)">
    
    <text x="150" y="0" class="label" font-size="18">① これまで（直列）</text>
    <text x="360" y="80" class="label" fill="#ef4444" font-size="20" text-anchor="start">遅い！(5秒)</text>

    <!-- Task A -->
    <rect x="0" y="30" width="180" height="40" class="bar" fill="#60a5fa" />
    <text x="90" y="55" class="label" fill="#fff">Task A (3秒)</text>

    <!-- Task B (starts after A) -->
    <rect x="180" y="80" width="120" height="40" class="bar" fill="#facc15" />
    <text x="240" y="105" class="label" fill="#fff">Task B (2秒)</text>

    <!-- Total Time Line -->
    <line x1="0" y1="150" x2="300" y2="150" stroke="#333" stroke-width="2" />
    <line x1="0" y1="145" x2="0" y2="155" stroke="#333" stroke-width="2" />
    <line x1="180" y1="145" x2="180" y2="155" stroke="#333" stroke-width="2" />
    <line x1="300" y1="145" x2="300" y2="155" stroke="#333" stroke-width="2" />
    
    <text x="0" y="170" class="time-label" text-anchor="middle">0s</text>
    <text x="180" y="170" class="time-label" text-anchor="middle">3s</text>
    <text x="300" y="170" class="time-label" text-anchor="middle">5s</text>
  </g>

  <!-- Divider -->
  <line x1="50" y1="280" x2="550" y2="280" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8,4" />

  <!-- ===============================
       2. Parallel (Bottom)
       =============================== -->
  <g transform="translate(100, 320)">
    <text x="150" y="0" class="label" font-size="18">② Promise.all（並列）</text>
    <text x="250" y="80" class="label" fill="#16a34a" font-size="20" text-anchor="start">速い！(3秒)</text>

    <!-- Task A -->
    <rect x="0" y="30" width="180" height="40" class="bar" fill="#60a5fa" />
    <text x="90" y="55" class="label" fill="#fff">Task A (3秒)</text>

    <!-- Task B (starts at 0) -->
    <rect x="0" y="80" width="120" height="40" class="bar" fill="#facc15" />
    <text x="60" y="105" class="label" fill="#fff">Task B (2秒)</text>
    
    <!-- Wait Line -->
    <line x1="180" y1="20" x2="180" y2="150" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5" />
    <text x="180" y="15" class="time-label" fill="#ef4444" text-anchor="middle">待機ライン</text>

    <!-- Total Time Line -->
    <line x1="0" y1="150" x2="180" y2="150" stroke="#333" stroke-width="2" />
    <line x1="0" y1="145" x2="0" y2="155" stroke="#333" stroke-width="2" />
    <line x1="180" y1="145" x2="180" y2="155" stroke="#333" stroke-width="2" />
    
    <text x="0" y="170" class="time-label" text-anchor="middle">0s</text>
    <text x="180" y="170" class="time-label" text-anchor="middle">3s</text>
  </g>
  
  <!-- Explanation -->
  <g transform="translate(100, 530)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#f0f9ff" stroke="#0ea5e9" />
    <text x="200" y="30" class="label" fill="#0369a1">Point</text>
    <text x="200" y="55" class="time-label" text-anchor="middle" font-size="16">「一番遅い作業」が終わった時点で完了！</text>
  </g>

</svg>
