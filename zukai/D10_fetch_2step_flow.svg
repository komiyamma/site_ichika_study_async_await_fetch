<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; font-family: sans-serif; text-anchor: middle; }
      .label { font-size: 14px; font-family: sans-serif; text-anchor: middle; fill: #333; }
      .step_label { font-size: 16px; font-weight: bold; font-family: sans-serif; fill: #333; }
      .sub_label { font-size: 12px; font-family: sans-serif; fill: #666; text-anchor: middle; }
      
      .box-wait { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; stroke-dasharray: 5,5; rx: 8; }
      .box-obj { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .box-result { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
      
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="250" y="40" class="title">fetchの「2回待つ」理由 (2 Step Flow)</text>

  <!-- ===============================
       Step 1: fetch() / Waiting for Delivery
       =============================== -->
  <g transform="translate(150, 70)">
    <text x="-80" y="35" class="step_label">① fetch()</text>
    
    <!-- Wait Box -->
    <rect x="0" y="0" width="200" height="80" class="box-wait" />
    <text x="100" y="35" class="label">🚚 配送中 (通信中)...</text>
    <text x="100" y="60" class="sub_label">1回目の await</text>
  </g>

  <!-- Arrow Down -->
  <path d="M 250 150 L 250 190" class="arrow" />

  <!-- ===============================
       Intermediate: Response Object
       =============================== -->
  <g transform="translate(150, 190)">
    <!-- Object Box -->
    <rect x="40" y="0" width="120" height="60" class="box-obj" />
    <text x="100" y="35" class="label">📄 伝票（ヘッダー）到着</text>
    <text x="180" y="35" class="step_label" fill="#2563eb" font-size="14" text-anchor="start">Response</text>
  </g>

  <!-- Arrow Down -->
  <path d="M 250 250 L 250 290" class="arrow" />

  <!-- ===============================
       Step 2: json() / Opening
       =============================== -->
  <g transform="translate(150, 290)">
    <text x="-80" y="35" class="step_label">② json()</text>
    
    <!-- Wait Box -->
    <rect x="0" y="0" width="200" height="80" class="box-wait" />
    <text x="100" y="35" class="label">✂️ 開封・変換中...</text>
    <text x="100" y="60" class="sub_label">2回目の await</text>
  </g>

  <!-- Arrow Down -->
  <path d="M 250 370 L 250 410" class="arrow" />

  <!-- ===============================
       Result: Data
       =============================== -->
  <g transform="translate(150, 410)">
    <!-- Result Box -->
    <rect x="40" y="0" width="120" height="60" class="box-result" />
    <text x="100" y="35" class="label">📄 中身ゲット！</text>
    <text x="180" y="35" class="step_label" fill="#16a34a" font-size="14" text-anchor="start">Data (JSON)</text>
  </g>
  
  <!-- Summary/Point -->
  <g transform="translate(50, 500)">
     <rect x="0" y="0" width="400" height="70" rx="10" fill="#f3f4f6" stroke="#4b5563" />
     <text x="200" y="30" class="label" fill="#1f2937">Point</text>
     <text x="200" y="50" class="sub_label">「伝票を確認」→「荷物を受け取る」の2段階！</text>
  </g>

</svg>
