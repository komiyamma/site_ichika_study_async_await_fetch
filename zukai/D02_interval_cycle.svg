<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; ry: 5; }
      .circle { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; }
      .label { font-size: 16px; font-weight: bold; text-anchor: middle; font-family: sans-serif; }
      .arrow { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .stop-sign { fill: #ef4444; stroke: #b91c1c; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a" />
    </marker>
  </defs>

  <text x="250" y="40" class="label" font-size="20">setInterval のイメージ（繰り返し）</text>

  <!-- Cycle Circle -->
  <path d="M 200 100 A 50 50 0 1 1 200 200 A 50 50 0 1 1 200 100" stroke="#e2e8f0" stroke-width="4" fill="none" />
  
  <path d="M 250 100 A 50 50 0 1 1 250 200" class="arrow" />
  <path d="M 250 200 A 50 50 0 1 1 250 100" class="arrow" />

  <text x="250" y="155" class="label" fill="#15803d">1000ms</text>
  <text x="250" y="175" font-size="12" text-anchor="middle" font-family="sans-serif">ごとに実行</text>

  <!-- Code Block -->
  <rect x="50" y="110" width="120" height="80" class="box" />
  <text x="110" y="140" class="label">処理を実行</text>
  <text x="110" y="160" font-size="12" text-anchor="middle" font-family="sans-serif">console.log...</text>

  <!-- Arrows connecting -->
  <line x1="190" y1="150" x2="170" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Stop Logic -->
  <rect x="350" y="120" width="120" height="60" class="box" style="stroke: #ef4444;" />
  <text x="410" y="145" class="label" fill="#b91c1c">clearInterval</text>
  <text x="410" y="165" font-size="12" text-anchor="middle" font-family="sans-serif">(IDを指定)</text>

  <path d="M 350 150 L 300 150" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowhead)" />
  
  <text x="325" y="140" font-size="14" fill="#ef4444" font-family="sans-serif">STOP!</text>

</svg>
