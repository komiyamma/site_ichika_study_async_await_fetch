<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <style>
      .box { fill: #fdf2f8; stroke: #be185d; stroke-width: 2; rx: 5; ry: 5; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: sans-serif; font-size: 12px; text-anchor: middle; fill: #666; }
      .arrow { stroke: #333; stroke-width: 3; marker-end: url(#arrowhead); fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="300" y="40" class="label" font-size="20">POSTリクエストの荷造り（3点セット）</text>

  <!-- The Package -->
  <g transform="translate(50, 80)">
    <!-- Box Body -->
    <rect x="0" y="0" width="300" height="200" fill="#fff" stroke="#333" stroke-width="3" rx="10" />
    
    <!-- 1. Method Stamp -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="80" height="40" fill="#dc2626" rx="5" />
      <text x="40" y="25" class="label" fill="#fff" font-size="14">POST</text>
      <text x="110" y="25" class="label" text-anchor="start" font-size="14">① メソッド</text>
      <text x="110" y="45" class="desc" text-anchor="start">「送ります！」</text>
    </g>

    <!-- 2. Header Tag -->
    <g transform="translate(20, 70)">
      <polygon points="0,0 80,0 100,20 80,40 0,40" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
      <circle cx="10" cy="20" r="5" fill="#fff" stroke="#ca8a04" />
      <text x="50" y="25" class="label" fill="#854d0e" font-size="12">JSON</text>
      <text x="110" y="25" class="label" text-anchor="start" font-size="14">② ヘッダー</text>
      <text x="110" y="45" class="desc" text-anchor="start">荷札「中身はJSONです」</text>
    </g>

    <!-- 3. Body Content -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="260" height="50" fill="#e0f2fe" stroke="#0284c7" stroke-dasharray="5,5" />
      <text x="130" y="30" class="label" fill="#0369a1">{ item: "Coffee" }</text>
      <text x="320" y="25" class="label" text-anchor="start" font-size="14">③ ボディ</text>
      <text x="320" y="45" class="desc" text-anchor="start">中身（JSON文字列）</text>
      <line x1="260" y1="25" x2="310" y2="25" stroke="#333" stroke-width="1" />
    </g>
  </g>

  <!-- Destination Server -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="100" height="150" fill="#f3f4f6" stroke="#4b5563" />
    <text x="50" y="30" class="label">サーバー</text>
    <text x="50" y="80" font-size="30" text-anchor="middle">🏭</text>
  </g>

  <!-- Truck Arrow -->
  <path d="M 360 180 L 440 180" class="arrow" />
  <text x="400" y="170" class="desc">配送</text>

</svg>
