<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; }
      .label { font-size: 14px; font-family: sans-serif; text-anchor: middle; }
      .title { font-size: 18px; font-weight: bold; font-family: sans-serif; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .spinner { fill: none; stroke: #3b82f6; stroke-width: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="300" y="30" class="title">おもてなしフロー (Loading UI)</text>

  <!-- Step 1: Click -->
  <g transform="translate(20, 80)">
    <rect x="0" y="0" width="100" height="60" class="box" fill="#f3f4f6" />
    <text x="50" y="35" class="label">🖱️ クリック</text>
  </g>
  
  <path d="M 120 110 L 160 110" class="arrow" />

  <!-- Step 2: Loading On -->
  <g transform="translate(160, 60)">
    <rect x="0" y="0" width="120" height="100" class="box" fill="#eff6ff" stroke="#3b82f6" />
    <text x="60" y="30" class="label" font-weight="bold">🌀 表示ON</text>
    <circle cx="60" cy="60" r="15" class="spinner" stroke-dasharray="20, 10" />
    <text x="60" y="90" class="label" font-size="10">「読み込み中...」</text>
  </g>

  <path d="M 280 110 L 320 110" class="arrow" />

  <!-- Step 3: Fetching -->
  <g transform="translate(320, 80)">
    <rect x="0" y="0" width="100" height="60" class="box" stroke-dasharray="4,4" />
    <text x="50" y="35" class="label">📡 通信中...</text>
  </g>

  <path d="M 420 110 L 460 110" class="arrow" />

  <!-- Step 4: Finish -->
  <g transform="translate(460, 60)">
    <rect x="0" y="0" width="120" height="100" class="box" fill="#f0fdf4" stroke="#16a34a" />
    <text x="60" y="30" class="label" font-weight="bold">✨ 表示OFF</text>
    <text x="60" y="60" class="label">🐶 画像ドン！</text>
    <text x="60" y="90" class="label" font-size="10">(finally)</text>
  </g>

</svg>
