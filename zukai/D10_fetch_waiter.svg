<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <style>
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .label { font-family: sans-serif; font-size: 14px; text-anchor: middle; font-weight: bold; }
      .desc { font-family: sans-serif; font-size: 12px; text-anchor: middle; fill: #666; }
      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; ry: 5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="400" y="40" class="label" font-size="20">APIとfetch()の関係（レストランの例）</text>

  <!-- Client -->
  <g transform="translate(50, 100)">
    <circle cx="50" cy="50" r="40" fill="#dbeafe" stroke="#2563eb" />
    <text x="50" y="55" class="label" fill="#1e40af">あなた</text>
    <text x="50" y="110" class="desc">(ブラウザ)</text>
  </g>

  <!-- Waiter (fetch) -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="100" height="120" class="box" fill="#fef3c7" stroke="#d97706" />
    <text x="50" y="30" class="label" fill="#b45309">fetch()</text>
    <text x="50" y="50" class="desc">ウェイター</text>
    <text x="50" y="80" font-size="20" text-anchor="middle">💁‍♂️</text>
  </g>

  <!-- Server (API) -->
  <g transform="translate(600, 60)">
    <rect x="0" y="0" width="150" height="150" class="box" fill="#f3f4f6" stroke="#4b5563" />
    <text x="75" y="30" class="label" fill="#374151">サーバー (API)</text>
    <text x="75" y="50" class="desc">厨房・倉庫</text>
    <text x="75" y="90" font-size="40" text-anchor="middle">🏭</text>
  </g>

  <!-- Arrows -->
  <!-- Request -->
  <path d="M 100 120 L 240 120" class="arrow" />
  <text x="170" y="110" class="desc">1. 注文(URL)</text>

  <path d="M 360 120 L 590 120" class="arrow" />
  <text x="475" y="110" class="desc">2. GETリクエスト</text>

  <!-- Response -->
  <path d="M 590 160 L 360 160" class="arrow" />
  <text x="475" y="180" class="desc">3. 料理を渡す</text>

  <path d="M 240 160 L 100 160" class="arrow" />
  <text x="170" y="180" class="desc">4. お届け(Response)</text>

  <!-- Detail Box -->
  <g transform="translate(200, 240)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#f0fff4" stroke="#16a34a" />
    <text x="200" y="30" class="label" fill="#15803d">レスポンスの正体</text>
    <text x="200" y="55" class="desc" font-size="14">まだ「蓋」が閉まっています。 .json() で開けないと中身は見えません！</text>
  </g>

</svg>
