<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <style>
      .core-box { stroke: #333; stroke-width: 2; rx: 5; }
      .core-busy { fill: #ef4444; }
      .core-active { fill: #f87171; }
      .label { font-family: sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-family: sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="300" y="40" class="title">C++/C#など実行時のCPU (フル並列)</text>

  <g transform="translate(50, 70)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 1</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(80, 0)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 2</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(160, 0)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 3</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(240, 0)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 4</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(320, 0)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 5</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(400, 0)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 6</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 80)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 7</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(80, 80)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 8</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(160, 80)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 9</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(240, 80)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 10</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(320, 80)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 11</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
    <g transform="translate(400, 80)">
      <rect width="70" height="70" class="core-box core-active" />
      <text x="35" y="40" class="label" fill="#fff">Core 12</text>
      <text x="35" y="60" class="label" fill="#fff" font-size="10">🔥</text>
    </g>
  </g>

  <text x="300" y="300" class="label" fill="#ef4444" font-size="16">全コア総動員！（フルパワー）</text>

</svg>
