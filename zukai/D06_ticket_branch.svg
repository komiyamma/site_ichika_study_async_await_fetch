<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <style>
      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 5; }
      .ticket { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .success { fill: #dcfce7; stroke: #16a34a; }
      .failure { fill: #fee2e2; stroke: #b91c1c; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
      .label { font-size: 16px; font-weight: bold; font-family: sans-serif; text-anchor: middle; }
      .desc { font-size: 12px; font-family: sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="300" y="40" class="label" font-size="20">チケットの自動振り分け (then / catch)</text>

  <!-- Ticket Node -->
  <g transform="translate(240, 70)">
    <rect width="120" height="70" class="ticket" />
    <text x="60" y="30" class="label" fill="#b45309">🎟️ チケット</text>
    <text x="60" y="50" class="desc">(Result)</text>
  </g>

  <!-- Branch -->
  <path d="M 300 140 L 300 180" class="arrow" />
  
  <g transform="translate(250, 180)">
    <polygon points="50 0, 100 40, 50 80, 0 40" fill="#f3f4f6" stroke="#4b5563" stroke-width="2" />
    <text x="50" y="35" class="label" font-size="12">成功?</text>
    <text x="50" y="55" class="label" font-size="12">失敗?</text>
  </g>

  <!-- Success Path -->
  <path d="M 250 220 L 150 220 L 150 260" class="arrow" stroke="#16a34a" />
  <text x="180" y="210" class="label" fill="#15803d" font-size="12">成功 (Fulfilled)</text>

  <g transform="translate(80, 260)">
    <rect width="140" height="60" class="box success" />
    <text x="70" y="35" class="label" fill="#15803d">✅ .then()</text>
  </g>

  <!-- Failure Path -->
  <path d="M 350 220 L 450 220 L 450 260" class="arrow" stroke="#b91c1c" />
  <text x="420" y="210" class="label" fill="#b91c1c" font-size="12">失敗 (Rejected)</text>

  <g transform="translate(380, 260)">
    <rect width="140" height="60" class="box failure" />
    <text x="70" y="35" class="label" fill="#b91c1c">⚡ .catch()</text>
  </g>

</svg>
