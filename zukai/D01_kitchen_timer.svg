<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 2; rx: 5; ry: 5; }
      .highlight { fill: #e0f2fe; stroke: #0284c7; }
      .title { font-size: 20px; font-weight: bold; text-anchor: middle; font-family: sans-serif; }
      .label { font-size: 16px; font-family: sans-serif; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="400" y="40" class="title">ノンブロッキングのイメージ（キッチンタイマー戦法）</text>

  <!-- Timeline -->
  <line x1="50" y1="100" x2="750" y2="100" stroke="#ccc" stroke-width="4" />
  <text x="50" y="90" font-family="sans-serif" font-size="12" fill="#666">時間の流れ →</text>

  <!-- Step 1 -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="120" height="80" class="box" />
    <text x="60" y="30" text-anchor="middle" class="label">①パスタ注文</text>
    <text x="60" y="60" text-anchor="middle" class="label" font-size="12">(ログ出力)</text>
  </g>
  <line x1="160" y1="100" x2="160" y2="120" class="arrow" />

  <!-- Step 2 -->
  <g transform="translate(250, 120)">
    <rect x="0" y="0" width="140" height="80" class="box highlight" />
    <text x="70" y="30" text-anchor="middle" class="label">②タイマーセット</text>
    <text x="70" y="60" text-anchor="middle" class="label" font-size="12">3秒後に予約</text>
  </g>
  <line x1="320" y1="100" x2="320" y2="120" class="arrow" />

  <!-- Timer arc -->
  <path d="M 320 200 Q 470 280 620 200" fill="none" stroke="#ef4444" stroke-width="3" class="dashed" />
  <text x="470" y="260" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-weight="bold">裏でカウントダウン中...</text>

  <!-- Step 3 -->
  <g transform="translate(420, 120)">
    <rect x="0" y="0" width="120" height="80" class="box" fill="#f0fdf4" style="stroke: #16a34a;" />
    <text x="60" y="30" text-anchor="middle" class="label">③待たずに</text>
    <text x="60" y="50" text-anchor="middle" class="label">サラダ作り</text>
  </g>
  <line x1="480" y1="100" x2="480" y2="120" class="arrow" />

  <!-- Step 4 -->
  <g transform="translate(580, 120)">
    <rect x="0" y="0" width="140" height="80" class="box highlight" />
    <text x="70" y="30" text-anchor="middle" class="label">④ピピピ！</text>
    <text x="70" y="60" text-anchor="middle" class="label" font-size="12">茹で上がり報告</text>
  </g>
  <line x1="650" y1="100" x2="650" y2="120" class="arrow" />
  <line x1="620" y1="200" x2="650" y2="200" class="arrow" />

</svg>
