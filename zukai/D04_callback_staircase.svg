<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <style>
      .box { fill: #f1f5f9; stroke: #334155; stroke-width: 2; rx: 5; ry: 5; }
      .arrow { stroke: #ef4444; stroke-width: 3; marker-end: url(#arrowhead); fill: none; }
      .text { font-family: sans-serif; font-size: 14px; fill: #1e293b; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #dc2626; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="300" y="40" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">コールバック地獄（ネストの階段）</text>

  <!-- Level 1 -->
  <rect x="50" y="70" width="500" height="280" class="box" fill="#fff" />
  <text x="70" y="100" class="text">1. setTimeout (3秒待つ)</text>
  
  <!-- Level 2 -->
  <rect x="100" y="120" width="400" height="200" class="box" fill="#f8fafc" />
  <text x="120" y="150" class="text">2. setTimeout (2秒待つ)</text>
    <path d="M 90 100 L 90 140 L 100 140" stroke="#ccc" fill="none" class="arrow" style="stroke: #64748b; stroke-width: 1;" />

  <!-- Level 3 -->
  <rect x="150" y="170" width="300" height="120" class="box" fill="#f1f5f9" />
  <text x="170" y="200" class="text">3. setTimeout (1秒待つ)</text>
    <path d="M 140 150 L 140 190 L 150 190" stroke="#ccc" fill="none" class="arrow" style="stroke: #64748b; stroke-width: 1;" />

  <!-- Target -->
  <rect x="200" y="220" width="200" height="50" class="box" fill="#fee2e2" stroke="#dc2626" />
  <text x="300" y="250" text-anchor="middle" class="label">🎉 ゴール！</text>

  <!-- The "Shape" Arrow -->
  <path d="M 60 110 L 110 160 L 160 210 L 210 240" class="arrow" stroke-dasharray="5,5" />
  <text x="400" y="320" class="label" fill="#dc2626">右へ右へと深くなる...</text>
  <text x="400" y="340" class="text">（これが「波動拳」の形）</text>

</svg>
