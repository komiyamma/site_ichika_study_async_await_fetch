<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <style>
      .arrow { stroke: #333; stroke-width: 3; marker-end: url(#arrowhead); fill: none; }
      .signal-line { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 10,5; marker-end: url(#arrowhead-red); fill: none; }
      .label { font-family: sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .desc { font-family: sans-serif; font-size: 12px; text-anchor: middle; fill: #666; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <text x="400" y="40" class="label" font-size="20">AbortController（通信キャンセル）の仕組み</text>

  <!-- Remote Control -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="180" rx="10" fill="#f3f4f6" stroke="#333" stroke-width="2" />
    <text x="60" y="30" class="desc">コントローラー</text>
    
    <!-- Button -->
    <circle cx="60" cy="80" r="30" fill="#ef4444" stroke="#b91c1c" stroke-width="3" />
    <text x="60" y="85" class="label" fill="#fff" font-size="12">ABORT</text>
    <text x="60" y="130" class="desc">.abort()</text>
    <text x="60" y="160" class="desc">スイッチON!</text>
  </g>

  <!-- Fetch Truck -->
  <g transform="translate(300, 120)">
    <rect x="0" y="0" width="200" height="100" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" />
    <text x="100" y="30" class="label" fill="#854d0e">fetch()</text>
    <text x="100" y="55" class="desc">通信中...</text>
    
    <!-- Antenna -->
    <line x1="160" y1="0" x2="160" y2="-30" stroke="#333" stroke-width="2" />
    <circle cx="160" cy="-35" r="5" fill="#ca8a04" />
    <text x="190" y="-30" class="desc" text-anchor="start">signal監視</text>
  </g>

  <!-- Signal Wave -->
  <path d="M 180 100 Q 250 50 350 80" class="signal-line" />
  <text x="260" y="60" class="label" fill="#ef4444" font-size="12">停止信号！</text>

  <!-- Stop Action -->
  <g transform="translate(550, 120)">
    <polygon points="0,0 40,20 0,40" fill="#ef4444" />
    <text x="60" y="25" class="label" fill="#b91c1c" text-anchor="start">急ブレーキ！</text>
    <text x="60" y="50" class="desc" text-anchor="start">AbortError発生</text>
    <text x="60" y="70" class="desc" text-anchor="start">(catchへ移動)</text>
  </g>

</svg>
